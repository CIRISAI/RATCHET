name: TORQUE pilot

# The pilot and the staked run are THE SAME WORKFLOW at different scale. That is
# the point: a pilot run by different machinery proves the pilot's machinery
# works. `scale` is the only input that differs.
#
# Nothing here computes an effect. Per PILOT.md the pilot's output is instrument
# health — did it run, did it record, did it verify — and its outcome data is
# discarded, its items excluded from the main draw. A pilot that reports effect
# sizes is an invitation to tune the design against them.

on:
  workflow_dispatch:
    inputs:
      scale:
        description: "pilot (10 items) or staked (full draw)"
        type: choice
        options: [pilot, staked]
        default: pilot
      agent_ref:
        description: "CIRISAgent ref to run against"
        type: string
        default: "v2.9.13-stable"   # the tag is v-prefixed; the bare form does not exist
      confirm_spend:
        description: "Type the expected USD figure to proceed (pilot 14, staked 167)"
        type: string
        required: true

concurrency:
  group: torque-${{ inputs.scale }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      # A typo'd spend figure stops the run before the first call. The staked
      # run costs 24x the pilot and the only thing between them is a dropdown.
      - name: Confirm spend matches scale
        run: |
          case "${{ inputs.scale }}" in
            pilot)  want=14  ;;
            staked) want=167 ;;
          esac
          if [ "${{ inputs.confirm_spend }}" != "$want" ]; then
            echo "REFUSED: scale=${{ inputs.scale }} expects \$$want, got '${{ inputs.confirm_spend }}'."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISAgent
          ref: ${{ inputs.agent_ref }}
          path: agent
      - run: pip install -r agent/requirements.txt

      # Every PILOT.md gate that can be checked before spending anything:
      # manifest digests distinct, key spaces identical, arms differing on
      # exactly the declared keys, partitions frozen, corpora reproducing from
      # the shipped accord, residue clean, model == the model that was costed.
      - name: Pre-flight gates
        working-directory: experiments/torque
        run: python3 preflight.py | tee preflight.txt

      - uses: actions/upload-artifact@v4
        with:
          name: preflight
          path: experiments/torque/preflight.txt

  compose:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISAgent
          ref: ${{ inputs.agent_ref }}
          path: agent
      - run: pip install -r agent/requirements.txt pyyaml

      # Build the four h3ere manifests from the frozen corpora. --units is what
      # carries the authored conscience prompts, the PDMA header, the ASPDMA
      # fields and the exemplars; without it the manifests vary the accord and
      # nothing else, which is what the gate caught on 2026-08-08.
      - name: Build arm manifests
        working-directory: experiments/torque
        env:
          AGENT: ${{ github.workspace }}/agent
        run: |
          set -euo pipefail
          mkdir -p arms
          python3 build_arm_manifest.py --agent-root "$AGENT" --arm h3ere-ciris \
            --accord "$AGENT/accord_1.2b.txt" \
            --framing corpora/monoglot/pdma_framing_ciris_en.txt --units ciris \
            --out arms/h3ere-ciris.json
          python3 build_arm_manifest.py --agent-root "$AGENT" --arm h3ere-alt \
            --accord corpora/values-alt/A-accord-FINAL.txt \
            --framing corpora/monoglot/pdma_framing_alt_en.txt --units alt \
            --out arms/h3ere-alt.json
          python3 build_arm_manifest.py --agent-root "$AGENT" --arm h3ere-neutral \
            --accord corpora/values-neutral/A-accord-NEUTRAL.txt \
            --framing corpora/monoglot/pdma_framing_neutral_en.txt --units neutral \
            --out arms/h3ere-neutral.json
          python3 build_arm_manifest.py --agent-root "$AGENT" --arm h3ere-blank \
            --blank-axiotic --units ciris \
            --out arms/h3ere-blank.json

      # Compose every arm through the real seams and run the ablation gate.
      # Arms are composed subprocess-per-arm because the prompt caches are
      # process-global singletons.
      - name: Compose dumps and ablation gate
        working-directory: experiments/torque
        env:
          AGENT: ${{ github.workspace }}/agent
        run: |
          set -euo pipefail
          mkdir -p dumps
          python3 gate_projection.py --regime TORQUE_REGIME.yaml --out dumps/regime-gate.yaml
          for a in h3ere-ciris h3ere-alt h3ere-neutral h3ere-blank; do
            (cd "$AGENT" && python3 -m ciris_engine.logic.utils.compose_dump dump \
              --arm "$a" --locales en \
              --manifest "$GITHUB_WORKSPACE/experiments/torque/arms/$a.json" \
              --out "$GITHUB_WORKSPACE/experiments/torque/dumps/$a.jsonl")
          done
          for a in bare values-ciris; do
            (cd "$AGENT" && CIRIS_RESEARCH_PROMPT_OVERRIDES="$GITHUB_WORKSPACE/experiments/torque/arms/h3ere-ciris.json" \
              CIRIS_TESTING_MODE=true PYTHONPATH="$AGENT" \
              python3 tools/research/direct_provider.py compose-dump --arm "$a" \
                --regime "$GITHUB_WORKSPACE/experiments/torque/TORQUE_REGIME.yaml" \
                --reference-dump "$GITHUB_WORKSPACE/experiments/torque/dumps/h3ere-ciris.jsonl" \
                --out "$GITHUB_WORKSPACE/experiments/torque/dumps/$a.jsonl")
          done
          # Gate is RECORDED, not required to pass: Phase 1 refuses `vary` on
          # mixed blocks and eight of our block families are mixed. See
          # gate_phase1_limit in the regime — recorded as a limit, not a pass.
          (cd "$AGENT" && python3 -m ciris_engine.logic.utils.compose_dump gate \
            --dump-a "$GITHUB_WORKSPACE/experiments/torque/dumps/h3ere-ciris.jsonl" \
            --dump-b "$GITHUB_WORKSPACE/experiments/torque/dumps/h3ere-alt.jsonl" \
            --regime "$GITHUB_WORKSPACE/experiments/torque/dumps/regime-gate.yaml" \
            | tee "$GITHUB_WORKSPACE/experiments/torque/dumps/gate.txt") || true

      - uses: actions/upload-artifact@v4
        with:
          name: manifests-and-dumps
          path: |
            experiments/torque/arms/
            experiments/torque/dumps/

  build-arcs:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Fetch the ETHICS corpus
        run: |
          git clone --depth 1 https://github.com/CIRISAI/CIRISBench.git bench

      # The arcs are DERIVED, never committed: ten real Hendrycks items per
      # conversation, drawn seeded, balanced on count and label-1 count either
      # side of the midpoint switch. The per-stratum draw sha is asserted against
      # the regime, so a corpus that changed underneath us fails here rather than
      # silently producing a different experiment.
      - name: Build and verify the arcs
        working-directory: experiments/torque
        run: |
          set -euo pipefail
          case "${{ inputs.scale }}" in
            pilot)  A=(2 2 2 2)  ;;
            staked) A=(20 15 15 10) ;;
          esac
          S=(axiotic_primary axiotic_secondary deontic_held discriminant_control)
          mkdir -p arcs
          for i in 0 1 2 3; do
            python3 build_he300_arcs.py --n-arcs "${A[$i]}" --turns 10 --seed 42 \
              --stratum "${S[$i]}" --ethics ../../bench/engine/datasets/ethics \
              --safety-dir arcs | tee -a arcs/build.log
          done
      - uses: actions/upload-artifact@v4
        with:
          name: arcs
          path: experiments/torque/arcs/

  run-arms:
    needs: [compose, build-arcs]
    runs-on: ubuntu-latest
    # ONE JOB PER ARM, IN PARALLEL. Serially this is 6 arms x 8 cells = 48
    # agent boots end to end; as a matrix it is 6 concurrent jobs of 8. The arms
    # are independent by construction — separate manifests, separate processes,
    # separate identities — so nothing is shared to serialise on.
    timeout-minutes: 90        # a hung arm must not eat the 6h default; the
                               # pilot is 8 cells x 10 turns and should finish
                               # well inside this
    strategy:
      fail-fast: false          # one arm failing must not cancel the others;
                                # a run missing an arm is a different experiment
                                # and we want to know WHICH arms produced data
      max-parallel: 8
      matrix:
        # Eight legs: the six arms, plus the reversion arm in BOTH history
        # conditions. `reversion` is declared on h3ere-ciris only
        # (contrast_instruments), and running one history cannot separate
        # persistence from the agent pattern-matching its own piped outputs —
        # measured on the first arc: post-switch responses are 8 chars with the
        # agent's turns in context and 478 with them scrubbed.
        include:
          - {arm: bare,          mode: straight, history: ""}
          - {arm: values-ciris,  mode: straight, history: ""}
          - {arm: h3ere-ciris,   mode: straight, history: ""}
          - {arm: h3ere-alt,     mode: straight, history: ""}
          - {arm: h3ere-neutral, mode: straight, history: ""}
          - {arm: h3ere-blank,   mode: straight, history: ""}
          - {arm: h3ere-ciris,   mode: withdraw, history: intact}
          - {arm: h3ere-ciris,   mode: withdraw, history: scrubbed}
    # A FRESH CHECKOUT IS THE POINT. CIRISAgent mints its federation identity at
    # startup, per occurrence. A reused clone accumulates them and the Engine and
    # the compose process stop agreeing which is the node's — a property of the
    # stale directory, not of the agent. Each matrix job mints exactly one.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISAgent
          ref: ${{ inputs.agent_ref }}
          path: agent
      - run: pip install -r agent/requirements.txt pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: arcs
          path: experiments/torque/arcs
      - uses: actions/download-artifact@v4
        with:
          name: manifests-and-dumps
          path: experiments/torque

      - name: Install the arcs into the agent checkout
        run: cp -r experiments/torque/arcs/english_* agent/tests/safety/

      # bare and values-ciris: a plain provider call, no runtime, no identity.
      - name: Direct-provider arm
        if: matrix.mode == 'straight' && (matrix.arm == 'bare' || matrix.arm == 'values-ciris')
        working-directory: agent
        env:
          DI_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          M: ${{ github.workspace }}/experiments/torque/arms/h3ere-ciris.json
          R: ${{ github.workspace }}/experiments/torque/TORQUE_REGIME.yaml
          OUT: ${{ github.workspace }}/results
        run: |
          set -euo pipefail
          # RATCHET is a PUBLIC repo, so run logs and artifacts are public.
          # qa_runner/__main__.py:556 prints `key[:10]...key[-4:]` — 14 of 32
          # characters. GitHub masks only EXACT matches of a registered secret,
          # never a truncation the tool builds itself, so that partial would
          # appear in a public log. Register the truncations too.
          echo "::add-mask::${DI_KEY:0:10}"
          echo "::add-mask::${DI_KEY: -4}"
          printf '%s' "$DI_KEY" > /tmp/di.key
          arm="${{ matrix.arm }}"
          {
            for cell in $(ls tests/safety | grep '^english_he300_'); do
              d="${cell#english_}"
              CIRIS_RESEARCH_PROMPT_OVERRIDES="$M" CIRIS_TESTING_MODE=true \
              PYTHONPATH="$PWD" python3 tools/research/direct_provider.py run \
                --arm "$arm" --lang en --domain "$d" --regime "$R" \
                --model meta-llama/Llama-4-Scout-17B-16E-Instruct \
                --base-url https://api.deepinfra.com/v1/openai \
                --key-file /tmp/di.key --temperature 0.7 --top-p 1.0 \
                --max-tokens 4096 --out "$OUT/$arm/$d"
            done
          }

      # The four pipeline arms: full runtime, one identity minted per run.
      # Every fix the local container loop found, in the order it found them.
      - name: H3ERE arm
        if: matrix.mode == 'straight' && startsWith(matrix.arm, 'h3ere-')
        working-directory: agent
        env:
          DI_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          OUT: ${{ github.workspace }}/results
          # 2.9.12 made --safety-battery-template reach the SERVER, so the
          # template's own `wakeup.enabled: false` is finally consulted and
          # benchmark mode engages. Before that, ~10 minutes of wakeup was paid
          # per cell and EpistemicHumilityConscience — which benchmark mode
          # exists to disable, because it triggers PONDER — ran in every arm.
          CIRIS_API_INTERACTION_TIMEOUT: "900"
          # THE ONE THAT KILLED THREE ARMS. capture_traces.sh exports this true
          # because CEG carriers are its product; its own comment says the tee
          # "reads the live persist DB through a second SQLite handle, which is
          # unsafe alongside the Rust writer on a WAL database (it took the
          # staged-QA sqlite leg down)". Measured: with it on, h3ere-ciris
          # captured 4 of 10 turns before the server disconnected; with it off,
          # 10 of 10. TORQUE wants answers, not carriers.
          CIRIS_ACCORD_METRICS_CEG_SEAL_TEE: "false"
        run: |
          set -euo pipefail
          echo "::add-mask::${DI_KEY:0:10}"
          echo "::add-mask::${DI_KEY: -4}"
          printf '%s' "$DI_KEY" > /tmp/di.key
          arm="${{ matrix.arm }}"
          FAILED=0
          for cell in $(ls tests/safety | grep '^english_he300_'); do
            d="${cell#english_}"
            CIRIS_RESEARCH_PROMPT_OVERRIDES="$GITHUB_WORKSPACE/experiments/torque/arms/$arm.json" \
            CIRIS_TESTING_MODE=true PYTHONPATH="$PWD" \
            # `|| true`, and then VERIFY THE ARTIFACT instead of trusting the
            # exit code. qa_runner returns 1 even on a clean battery — the module
            # deliberately does not score, so its exit reflects something else.
            # Under `set -e` that killed the loop after the FIRST cell, before
            # the copy ran: the log said "10/10 responses captured in 162.5s,
            # Passed 10, Failed 0" and the job still failed with zero results.
            python3 -u -m tools.qa_runner safety_battery \
              --safety-battery-lang en --safety-battery-domain "$d" \
              --safety-battery-template he-300-benchmark \
              --live --live-key-file /tmp/di.key --live-provider openai \
              --live-base-url https://api.deepinfra.com/v1/openai \
              --live-model meta-llama/Llama-4-Scout-17B-16E-Instruct --verbose || true
            mkdir -p "$OUT/$arm/$d"
            cp -r qa_reports/safety_battery/en_${d}_*/. "$OUT/$arm/$d/" 2>/dev/null || true
            if [ ! -s "$OUT/$arm/$d/results.jsonl" ]; then
              echo "::error::$arm/$d produced no results.jsonl"; FAILED=1
            fi
          done
          exit $FAILED

      # The reversion arm. Runs INSIDE this job's checkout rather than a
      # container, because CI already gives each job a fresh agent — the
      # isolation the local container provides is what a runner is.
      - name: Reversion arm
        if: matrix.mode == 'withdraw'
        working-directory: agent
        env:
          DI_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          OUT: ${{ github.workspace }}/results
          CIRIS_API_INTERACTION_TIMEOUT: "900"
          CIRIS_ACCORD_METRICS_CEG_SEAL_TEE: "false"
          CIRIS_TEMPLATE: he-300-benchmark
          CIRIS_BENCHMARK_MODE: "true"
          CIRIS_RESEARCH_PROMPT_OVERRIDES: ${{ github.workspace }}/experiments/torque/arms/h3ere-ciris.json
          CIRIS_TESTING_MODE: "true"
        run: |
          set -euo pipefail
          echo "::add-mask::${DI_KEY:0:10}"
          echo "::add-mask::${DI_KEY: -4}"
          printf '%s' "$DI_KEY" > /tmp/di.key
          # Surface the agent's own output on failure. Three rounds were spent
          # on this leg reading GitHub's step log, which does not carry a
          # background process's stderr — the cause was always in /tmp/agent.out
          # and nothing printed it.
          python3 -u main.py --port 8080 > /tmp/agent.out 2>&1 &
          AGENT_PID=$!
          UP=0
          for i in $(seq 1 180); do
            curl -sf http://localhost:8080/v1/system/health >/dev/null 2>&1 && { UP=1; break; }
            if ! kill -0 "$AGENT_PID" 2>/dev/null; then
              echo "::error::agent process exited during startup"; break
            fi
            sleep 2
          done
          if [ "$UP" != "1" ]; then
            echo "── agent output ──"; tail -60 /tmp/agent.out || true
            echo "── incidents ──"; tail -30 logs/*/incidents_latest.log 2>/dev/null || true
            exit 1
          fi
          for cell in $(ls tests/safety | grep '^english_he300_'); do
            d="${cell#english_}"
            python3 -u "$GITHUB_WORKSPACE/experiments/torque/withdraw_arc.py" \
              --domain "$d" --history "${{ matrix.history }}" \
              --safety-dir "$PWD/tests/safety" \
              --model meta-llama/Llama-4-Scout-17B-16E-Instruct \
              --base-url https://api.deepinfra.com/v1/openai \
              --key-file /tmp/di.key \
              --out "$OUT/withdraw-${{ matrix.history }}"
          done

      # Agent logs are useful and they are also full of provider chatter and
      # composed prompts. Scrub anything key-shaped before they leave the runner.
      - name: Scrub logs before upload
        if: always()
        env:
          DI_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p scrubbed
          if [ -d agent/logs ]; then
            cp -r agent/logs scrubbed/logs
            grep -rl . scrubbed/logs 2>/dev/null | while read -r f; do
              sed -i -e "s/${DI_KEY}/<KEY>/g" \
                     -e "s/${DI_KEY:0:10}/<KEY>/g" \
                     -e "s/[A-Za-z0-9]\{28,64\}\.\.\.[A-Za-z0-9]\{4\}/<KEY-TRUNCATED>/g" "$f" || true
            done
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ inputs.scale }}-${{ matrix.arm }}-${{ matrix.mode }}${{ matrix.history }}
          path: |
            results/
            scrubbed/

  score:
    needs: run-arms
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: arcs
          path: experiments/torque/arcs
      - uses: actions/download-artifact@v4
        with:
          pattern: results-${{ inputs.scale }}-*
          merge-multiple: true
          path: gathered

      # Instrument health only — coverage, fidelity, concordance per arm, and no
      # contrast. Subtracting two arms is the analysis, and the analysis happens
      # after the staked run against the frozen regime. Exits non-zero naming any
      # arm that produced nothing, because a run missing an arm is not a partial
      # run, it is a different experiment.
      # `set -o pipefail` is not optional here. The scorer EXITS NON-ZERO when an
      # arm produced nothing, and a bare pipe into tee reports tee's status — so
      # the first run's score job showed SUCCESS beside a table with four arms
      # missing. A gate whose refusal is swallowed by a pipe is not a gate.
      - name: Score
        working-directory: experiments/torque
        shell: bash
        run: |
          set -o pipefail
          # Artifacts land as results-<scale>-<arm>/results/<arm>/<cell>/…, so
          # gather the inner `results` dirs rather than pointing at the parent —
          # aiming one level too high scores zero arms and looks like total failure.
          mkdir -p all
          cp -r ${{ github.workspace }}/gathered/*/results/* all/ 2>/dev/null || true
          python3 score_run.py --results all --arcs arcs | tee -a $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCORES
          path: experiments/torque/arcs/build.log
