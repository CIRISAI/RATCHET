name: Market 4 correction eval

# ai-safety-claims Market 4 ("corrections change the system", contract v3) on a
# real CIRIS agent with a live model: one frozen correction episode per job,
# each on a freshly booted agent.
#
# The harness (tools/qa_runner correction_episodes + its registration) lives in
# CIRISAgent (branch market4/on-v2210 for v2.21.0-stable; market4/on-v2200, market4/on-v2164 and
# market4/correction-eval for earlier engines), pinned here by commit. The
# SYSTEM UNDER TEST is the engine at `engine_commit`; the `plan` job fails the
# run if the harness checkout's ciris_engine/, ciris_adapters/, main.py or
# requirements.txt differ from it. This file lives in RATCHET because
# workflow_dispatch needs the workflow on a default branch and RATCHET already
# holds the OpenRouter key its other live-model experiments use.
#
# The frozen cases come in by URL + sha256 (the workbench freeze tag), so the
# run can only use the cases that were frozen. Every raw log is attested.

on:
  workflow_dispatch:
    inputs:
      cases_url:
        description: 'URL of the frozen freeze-cases.jsonl (raw file at the workbench freeze tag)'
        required: true
        type: string
      cases_sha256:
        description: 'sha256 of that file; the run refuses on mismatch'
        required: true
        type: string
      harness_ref:
        description: 'CIRISAgent commit carrying the harness (branch market4/on-v2210 for v2.21.0-stable)'
        required: false
        default: '79d47b56d40f61674cb6f0a551c3bf7a0b2928c4'
        type: string
      engine_commit:
        description: 'Engine commit the harness checkout must be byte-identical to under ciris_engine/, ciris_adapters/, main.py, requirements.txt'
        required: false
        default: 'd4b2313bb77fdbcb487c25017a149d8a5beba80a'
        type: string
      model:
        description: 'OpenRouter model id for the agent under test'
        required: false
        default: 'qwen/qwen3.6-35b-a3b'
        type: string
      template_id:
        description: 'Agent template'
        required: false
        default: 'default'
        type: string
      case_filter:
        description: 'Space-separated case_ids to run (blank = every case in the file)'
        required: false
        default: ''
        type: string
      repeats:
        description: 'Independent episodes per case (each on its own fresh agent); 1 = one per case'
        required: false
        default: '1'
        type: string
      max_parallel:
        description: 'Concurrent episodes'
        required: false
        default: '6'
        type: string
      constraints_url:
        description: 'Optional pip constraints file (raw URL) pinning every package version; blank = the agent requirements ranges'
        required: false
        default: ''
        type: string
      constraints_sha256:
        description: 'sha256 of the constraints file; the run refuses on mismatch (required with constraints_url)'
        required: false
        default: ''
        type: string
      provider_order:
        description: 'OPENROUTER_PROVIDER_ORDER for the agent (preference; OpenRouter falls back if unavailable). Blank = OpenRouter routing'
        required: false
        default: 'DeepInfra,Parasail'
        type: string
      llm_seed:
        description: 'CIRIS_LLM_SEED sent with every call (temperature is 0 by default). Blank = no seed'
        required: false
        default: '20261022'
        type: string
      prestep:
        description: 'Pre-step mode (M4_PRESTEP=1): no correction delivered; default behaviour on every probe twice, and for genuine cases the rule told directly (inline and by the WA). Not scoreable as Market 4 trials'
        required: false
        default: 'false'
        type: string
      server_wheel_release:
        description: 'Optional: tag of a (draft) RATCHET release holding a candidate ciris-server wheel, installed over the agent pin with --force-reinstall --no-deps. Blank = the agent pin'
        required: false
        default: ''
        type: string
      server_wheel_sha256:
        description: 'sha256 of that wheel; the run refuses on mismatch (required with server_wheel_release)'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  attestations: write
  contents: read

concurrency:
  group: market4-${{ github.run_id }}
  cancel-in-progress: false

env:
  CIRIS_TRACE_RUN_KIND: qa
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: Plan (verify cases, pin engine)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write only so this job can read a DRAFT release (the candidate wheel); it runs no agent. The episode
    # jobs keep the workflow's read-only token and receive the wheel as an artifact.
    permissions:
      contents: write
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISAgent
          ref: ${{ inputs.harness_ref }}
          path: agent
          fetch-depth: 0
      - name: Engine is byte-identical to the pinned commit
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${{ inputs.engine_commit }}^{commit}" || { echo "::error::engine commit not found"; exit 1; }
          if ! git diff --quiet "${{ inputs.engine_commit }}" HEAD -- ciris_engine ciris_adapters main.py requirements.txt; then
            echo "::error::harness checkout differs from engine ${{ inputs.engine_commit }} under the engine paths:"
            git diff --stat "${{ inputs.engine_commit }}" HEAD -- ciris_engine ciris_adapters main.py requirements.txt
            exit 1
          fi
          echo "engine tree identical to ${{ inputs.engine_commit }}; harness commit $(git rev-parse HEAD)"
      - name: Fetch and verify the frozen cases
        id: cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m4-cases
          curl -sSfL "${{ inputs.cases_url }}" -o /tmp/m4-cases/freeze-cases.jsonl
          ACTUAL=$(sha256sum /tmp/m4-cases/freeze-cases.jsonl | cut -d' ' -f1)
          if [ "$ACTUAL" != "${{ inputs.cases_sha256 }}" ]; then
            echo "::error::cases sha256 mismatch: got $ACTUAL, expected ${{ inputs.cases_sha256 }}"; exit 1
          fi
          CASES=$(python3 -I -c '
          import json, sys
          flt = set(sys.argv[1].split())
          reps = max(1, int(sys.argv[2] or "1"))
          ids = [json.loads(l)["case_id"] for l in open("/tmp/m4-cases/freeze-cases.jsonl", encoding="utf-8") if l.strip()]
          ids = [i for i in ids if not flt or i in flt]
          print(json.dumps([{"case": i, "rep": r, "tag": i if reps == 1 else f"{i}-r{r}"} for i in ids for r in range(1, reps + 1)]))
          ' '${{ inputs.case_filter }}' '${{ inputs.repeats }}')
          echo "cases=$CASES" >> "$GITHUB_OUTPUT"
          echo "cases: $CASES"
          python3 -I -c '
          import json
          json.dump({"harness_repo": "https://github.com/CIRISAI/CIRISAgent", "harness_commit": "${{ inputs.harness_ref }}",
                     "engine_commit": "${{ inputs.engine_commit }}", "ratchet_commit": "${{ github.sha }}",
                     "cases_url": "${{ inputs.cases_url }}", "cases_sha256": "${{ inputs.cases_sha256 }}",
                     "model": "${{ inputs.model }}", "template_id": "${{ inputs.template_id }}",
                     "constraints_url": "${{ inputs.constraints_url }}", "constraints_sha256": "${{ inputs.constraints_sha256 }}",
                     "provider_order": "${{ inputs.provider_order }}", "llm_seed": "${{ inputs.llm_seed }}",
                     "workflow_ref": "${{ github.ref }}",
                     "server_wheel_release": "${{ inputs.server_wheel_release }}", "prestep": "${{ inputs.prestep }}", "server_wheel_sha256": "${{ inputs.server_wheel_sha256 }}",
                     "run_id": "${{ github.run_id }}", "cases": json.loads(open("/dev/stdin").read())},
                    open("/tmp/m4-cases/run-manifest.json", "w"), indent=1)
          ' <<< "$CASES"
      - uses: actions/upload-artifact@v4
        with:
          name: m4-frozen-cases
          path: |
            /tmp/m4-cases/freeze-cases.jsonl
            /tmp/m4-cases/run-manifest.json
          retention-days: 90
      - name: Stage the candidate ciris-server wheel
        if: inputs.server_wheel_release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/m4-wheel
          gh release download "${{ inputs.server_wheel_release }}" -R "${{ github.repository }}" -p 'ciris_server-*.whl' -D /tmp/m4-wheel
          WHL=$(ls /tmp/m4-wheel/ciris_server-*.whl | head -1)
          GOT=$(sha256sum "$WHL" | cut -d' ' -f1)
          if [ "$GOT" != "${{ inputs.server_wheel_sha256 }}" ]; then
            echo "::error::server wheel sha256 mismatch: got $GOT, expected ${{ inputs.server_wheel_sha256 }}"; exit 1
          fi
          echo "staged $(basename "$WHL") sha256 $GOT"
      - if: inputs.server_wheel_release != ''
        uses: actions/upload-artifact@v4
        with:
          name: m4-server-wheel
          path: /tmp/m4-wheel/
          retention-days: 30

  episode:
    name: ${{ matrix.item.tag }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.cases) }}
    env:
      CIRIS_TEST_MODE: "true"
      CIRIS_TESTING_MODE: "true"
      M4_ENGINE_COMMIT: ${{ inputs.engine_commit }}
      M4_HARNESS_COMMIT: ${{ inputs.harness_ref }}
      MODEL_INPUT: ${{ inputs.model }}
      TEMPLATE_INPUT: ${{ inputs.template_id }}
      OPENROUTER_PROVIDER_ORDER: ${{ inputs.provider_order }}
      CIRIS_LLM_SEED: ${{ inputs.llm_seed }}
      M4_PRESTEP: ${{ inputs.prestep == 'true' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISAgent
          ref: ${{ inputs.harness_ref }}
          path: agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-m4-${{ runner.os }}-${{ hashFiles('agent/requirements.txt', 'agent/requirements-dev.txt') }}
      - name: Install CIRISVerify system deps (libtss2)
        shell: bash
        run: |
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && \
            sudo apt-get install -y --no-install-recommends libtss2-tctildr0 libtss2-esys-3.0.2-0 libtss2-mu-4.0.1-0 && break
            sleep 15
          done
      - if: inputs.server_wheel_release != ''
        uses: actions/download-artifact@v4
        with:
          name: m4-server-wheel
          path: /tmp/m4-wheel
      - name: Install the agent and the QA runner
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          CONSTRAINT_ARGS=()
          if [ -n "${{ inputs.constraints_url }}" ]; then
            curl -sSfL "${{ inputs.constraints_url }}" -o /tmp/m4-constraints.txt
            GOT=$(sha256sum /tmp/m4-constraints.txt | cut -d' ' -f1)
            if [ "$GOT" != "${{ inputs.constraints_sha256 }}" ]; then
              echo "::error::constraints sha256 mismatch: got $GOT, expected ${{ inputs.constraints_sha256 }}"; exit 1
            fi
            CONSTRAINT_ARGS=(-c /tmp/m4-constraints.txt)
          fi
          pip install "${CONSTRAINT_ARGS[@]}" -e .
          pip install "${CONSTRAINT_ARGS[@]}" -r requirements-dev.txt
          if [ -n "${{ inputs.server_wheel_release }}" ]; then
            WHL=$(ls /tmp/m4-wheel/ciris_server-*.whl | head -1)
            GOT=$(sha256sum "$WHL" | cut -d' ' -f1)
            if [ "$GOT" != "${{ inputs.server_wheel_sha256 }}" ]; then
              echo "::error::server wheel sha256 mismatch: got $GOT, expected ${{ inputs.server_wheel_sha256 }}"; exit 1
            fi
            pip install --force-reinstall --no-deps "$WHL"
            echo "candidate ciris-server installed: $(basename "$WHL") sha256 $GOT"
          fi
          mkdir -p qa_reports/correction_episodes
          pip freeze --exclude-editable > "qa_reports/correction_episodes/${{ matrix.item.case }}_env_logs_pip-freeze.txt" || true
          mkdir -p "qa_reports/correction_episodes/${{ matrix.item.case }}_env_logs"
          mv "qa_reports/correction_episodes/${{ matrix.item.case }}_env_logs_pip-freeze.txt" "qa_reports/correction_episodes/${{ matrix.item.case }}_env_logs/pip-freeze.txt"
          python --version > "qa_reports/correction_episodes/${{ matrix.item.case }}_env_logs/python-version.txt" 2>&1
      - uses: actions/download-artifact@v4
        with:
          name: m4-frozen-cases
          path: /tmp/m4-cases
      - name: Write OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.RATCHET_OPENROUTER_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENROUTER_API_KEY" ]; then echo "::error::RATCHET_OPENROUTER_KEY not in scope"; exit 1; fi
          umask 077
          printf '%s' "$OPENROUTER_API_KEY" > "$HOME/.openrouter_key"
      # Credit pause. If the provider refuses for credit (HTTP 402, "run out of credit", insufficient_quota) at any
      # point in an episode, the episode is contaminated: it is stopped, its files are kept under
      # qa_reports/credit_paused/attempt-N/ (uploaded with the agent logs), the job waits until a 1-token request to
      # the same model is accepted, and the episode is rerun from a wiped start. Every pause is logged to
      # qa_reports/credit_pauses.jsonl. It never waits out the key's weekly limit: if the key reports less than
      # M4_MIN_KEY_REMAINING dollars left it stops red. Bounds: M4_MAX_ATTEMPTS episodes and M4_PAUSE_BUDGET_S seconds
      # of waiting per job.
      - name: Run the episode (pauses on provider credit refusals, then reruns from scratch)
        id: run
        timeout-minutes: 320
        working-directory: agent
        shell: bash
        env:
          M4_MAX_ATTEMPTS: '4'
          M4_PAUSE_BUDGET_S: '5400'
          M4_ATTEMPT_TIMEOUT_S: '7800'
          M4_MIN_KEY_REMAINING: '2'
        run: |
          set -u -o pipefail
          CASE="${{ matrix.item.case }}"
          mkdir -p qa_reports qa_reports/credit_paused
          PAUSES=qa_reports/credit_pauses.jsonl; : > "$PAUSES"
          MARK='run out of credit|insufficient_quota|Error code: 402|would exceed your available credits|LLM BILLING ERROR'
          # OpenRouter's in-flight-budget 402 (limit_source openrouter_in_flight_budget) is transient: from CIRISAgent
          # #1366 item 20 the engine waits Retry-After and retries it, so it does not stop the episode. Only a
          # terminal credit failure does (balance, key limit, a credit refusal the harness saw in a reply). Engines
          # without item 20 fail the call, and the harness's null-reply rule then shows it; set M4_INFLIGHT_STOP=1
          # to keep stopping on in-flight 402s for such engines.
          INFLIGHT='in_flight_budget|openrouter_in_flight_budget|given your current in-flight requests'
          credit_lines() {
            { grep -hsE "$MARK" "qa_reports/correction_episodes/$CASE.jsonl" "qa_reports/episode_$CASE.log" 2>/dev/null
              [ -d logs ] && grep -rhsE "$MARK" logs/ 2>/dev/null; } || true
          }
          credit_hit() {
            if [ "${M4_INFLIGHT_STOP:-0}" = 1 ]; then credit_lines | grep -q . && return 0; return 1; fi
            credit_lines | grep -vE "$INFLIGHT" | grep -q . && return 0
            return 1
          }
          inflight_count() { credit_lines | grep -cE "$INFLIGHT" || true; }
          provider_ok() {   # 1-token request to the same model; prints the HTTP status
            python3 - "$MODEL_INPUT" <<'PY'
          import json, os, sys, urllib.request, urllib.error
          key = open(os.path.expanduser("~/.openrouter_key")).read().strip()
          req = urllib.request.Request("https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps({"model": sys.argv[1], "max_tokens": 1,
                               "messages": [{"role": "user", "content": "ok"}]}).encode(),
              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"})
          try:
              print(urllib.request.urlopen(req, timeout=60).status)
          except urllib.error.HTTPError as e:
              print(e.code)
          except Exception:
              print(0)
          PY
          }
          key_remaining() {  # dollars left on the key's limit; "none" when the key has no limit
            python3 - <<'PY'
          import json, os, urllib.request
          key = open(os.path.expanduser("~/.openrouter_key")).read().strip()
          try:
              d = json.load(urllib.request.urlopen(urllib.request.Request("https://openrouter.ai/api/v1/key",
                  headers={"Authorization": f"Bearer {key}"}), timeout=30))["data"]
              print("none" if d.get("limit_remaining") is None else d["limit_remaining"])
          except Exception:
              print("unknown")
          PY
          }
          log_pause() { printf '{"t":"%s","case":"%s","attempt":%d,"event":"%s"%s}\n' "$(date -u +%FT%TZ)" "$CASE" "$ATTEMPT" "$1" "${2:-}" >> "$PAUSES"; }

          WAITED=0; ATTEMPT=0
          while :; do
            ATTEMPT=$((ATTEMPT+1))
            rm -rf logs "qa_reports/correction_episodes/$CASE.jsonl"
            for d in qa_reports/correction_episodes/"${CASE}"_*_logs; do
              [ -e "$d" ] && [ "$d" != "qa_reports/correction_episodes/${CASE}_env_logs" ] && rm -rf "$d"
            done
            setsid bash -c 'exec timeout --signal=TERM --kill-after=60 "$0" python3 -m tools.qa_runner correction_episodes \
                --correction-cases-file /tmp/m4-cases/freeze-cases.jsonl --correction-case-id "$1" \
                --live --live-key-file "$HOME/.openrouter_key" --live-base-url https://openrouter.ai/api/v1 \
                --live-model "$2" --safety-battery-template "$3" \
                --wipe-data --proceed-anyway --timeout 7200 --verbose 2>&1' \
              "$M4_ATTEMPT_TIMEOUT_S" "$CASE" "$MODEL_INPUT" "$TEMPLATE_INPUT" > "qa_reports/episode_$CASE.log" 2>&1 &
            PG=$!; HIT=0
            while kill -0 "$PG" 2>/dev/null; do
              sleep 15
              if credit_hit; then
                HIT=1; echo "::notice::provider credit pause in attempt $ATTEMPT of $CASE: stopping the episode, will rerun it from a wiped start"
                kill -TERM -- "-$PG" 2>/dev/null || true; sleep 30; kill -KILL -- "-$PG" 2>/dev/null || true; break
              fi
            done
            # `|| RC=$?`: under bash -e a bare `wait` on the process group we just killed exits the step before the
            # pause below can run (RATCHET run 44208916740: 12 episodes lost this way on an in-flight-budget 402).
            RC=0; wait "$PG" || RC=$?
            [ "$HIT" = 0 ] && credit_hit && HIT=1
            pkill -f "$PWD/main.py" 2>/dev/null || true
            cat "qa_reports/episode_$CASE.log"
            if [ "$HIT" = 0 ]; then
              # The runner's incidents gate fails an episode on provider/runtime transients (connection errors,
              # DMA or interact timeouts, log floods) even when it produced a verdict. Those are infrastructure,
              # reported, not behavioural failures: with a verdict in the raw log, the job stays green and the
              # incident lines go to qa_reports/infra_incidents.txt and the job summary. No verdict: still red.
              RAW="qa_reports/correction_episodes/$CASE.jsonl"
              if [ "$RC" != 0 ] && grep -qs '"event": "verdict"' "$RAW"; then
                grep -h '\[INCIDENTS-GATE\] FAILED' "qa_reports/episode_$CASE.log" > qa_reports/infra_incidents.txt || true
                N=$(wc -l < qa_reports/infra_incidents.txt)
                log_pause done_with_infra_incidents ",\"rc\":$RC,\"incidents\":$N"
                echo "::notice::$CASE produced a verdict; runner rc=$RC from $N infrastructure incident line(s), recorded in infra_incidents.txt"
                { echo "### $CASE: verdict produced; infrastructure incidents (not behavioural)"; echo '```';
                  cat qa_reports/infra_incidents.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              log_pause done ",\"rc\":$RC,\"inflight_402_lines\":$(inflight_count)"
              exit "$RC"
            fi
            D="qa_reports/credit_paused/attempt-$ATTEMPT"; mkdir -p "$D"
            cp -r "qa_reports/episode_$CASE.log" logs "qa_reports/correction_episodes/$CASE.jsonl" "$D/" 2>/dev/null || true
            cp -r qa_reports/correction_episodes/${CASE}_*_logs "$D/" 2>/dev/null || true
            log_pause credit_refusal ",\"kept\":\"$D\""
            if [ "$ATTEMPT" -ge "$M4_MAX_ATTEMPTS" ]; then
              echo "::error::$CASE: credit refusals in all $ATTEMPT attempts; no clean episode"; exit 1
            fi
            S=60
            while :; do
              REM=$(key_remaining)
              if [ "$REM" != none ] && [ "$REM" != unknown ] && python3 -c "import sys; sys.exit(0 if float('$REM') < float('$M4_MIN_KEY_REMAINING') else 1)"; then
                log_pause key_limit ",\"remaining\":\"$REM\""
                echo "::error::$CASE: the key's limit is nearly spent (\$$REM left); not waiting for the weekly reset"; exit 1
              fi
              if [ "$WAITED" -ge "$M4_PAUSE_BUDGET_S" ]; then
                log_pause pause_budget_spent ",\"waited_s\":$WAITED"
                echo "::error::$CASE: provider still refusing after ${WAITED}s of waiting"; exit 1
              fi
              echo "credit pause: waiting ${S}s (waited ${WAITED}s so far; key remaining: $REM)"
              sleep "$S"; WAITED=$((WAITED+S))
              CODE=$(provider_ok)
              log_pause probe ",\"status\":$CODE,\"waited_s\":$WAITED"
              [ "$CODE" = 200 ] && break
              S=$(( S*2 > 600 ? 600 : S*2 ))
            done
            echo "provider accepts again after ${WAITED}s; rerunning $CASE from a wiped start (attempt $((ATTEMPT+1)))"
          done
      - name: Raw log present
        if: always()
        working-directory: agent
        shell: bash
        run: |
          ls -la qa_reports/correction_episodes/ || true
          test -s "qa_reports/correction_episodes/${{ matrix.item.case }}.jsonl"
      - name: Attest the raw log and the installed environment
        if: always()
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            agent/qa_reports/correction_episodes/${{ matrix.item.case }}.jsonl
            agent/qa_reports/correction_episodes/${{ matrix.item.case }}_env_logs/pip-freeze.txt
      - name: Upload the raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-raw-${{ matrix.item.tag }}
          path: agent/qa_reports/correction_episodes/${{ matrix.item.case }}.jsonl
          retention-days: 90
          if-no-files-found: error
      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-agent-logs-${{ matrix.item.tag }}
          path: |
            agent/qa_reports/episode_${{ matrix.item.case }}.log
            agent/qa_reports/credit_pauses.jsonl
            agent/qa_reports/credit_paused/
            agent/qa_reports/infra_incidents.txt
            agent/qa_reports/correction_episodes/${{ matrix.item.case }}_*_logs/
            agent/logs/
          retention-days: 30
          if-no-files-found: warn
