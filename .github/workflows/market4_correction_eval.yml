name: Market 4 correction eval

# ai-safety-claims Market 4 ("corrections change the system", contract v3) on a
# real CIRIS agent with a live model: one frozen correction episode per container,
# each on a freshly booted agent; `lanes` runner jobs each run `lane_width` containers at a time.
#
# The harness (tools/qa_runner correction_episodes + its registration) lives in
# CIRISAgent (branch market4/on-v2210 for v2.21.0-stable; market4/on-v2200, market4/on-v2164 and
# market4/correction-eval for earlier engines), pinned here by commit. The
# SYSTEM UNDER TEST is the engine at `engine_commit`; the `plan` job fails the
# run if the harness checkout's ciris_engine/, ciris_adapters/, main.py or
# requirements.txt differ from it. This file lives in RATCHET because
# workflow_dispatch needs the workflow on a default branch and RATCHET already
# holds the OpenRouter key its other live-model experiments use.
#
# The frozen cases come in by URL + sha256 (the workbench freeze tag), so the
# run can only use the cases that were frozen. Every raw log is attested.

on:
  workflow_dispatch:
    inputs:
      cases_url:
        description: 'URL of the frozen freeze-cases.jsonl (raw file at the workbench freeze tag)'
        required: true
        type: string
      cases_sha256:
        description: 'sha256 of that file; the run refuses on mismatch'
        required: true
        type: string
      harness_ref:
        description: 'CIRISAgent commit carrying the harness (branch market4/on-v2210 for v2.21.0-stable)'
        required: false
        default: '79d47b56d40f61674cb6f0a551c3bf7a0b2928c4'
        type: string
      engine_commit:
        description: 'Engine commit the harness checkout must be byte-identical to under ciris_engine/, ciris_adapters/, main.py, requirements.txt'
        required: false
        default: 'd4b2313bb77fdbcb487c25017a149d8a5beba80a'
        type: string
      model:
        description: 'OpenRouter model id for the agent under test'
        required: false
        default: 'qwen/qwen3.6-35b-a3b'
        type: string
      template_id:
        description: 'Agent template'
        required: false
        default: 'default'
        type: string
      case_filter:
        description: 'Space-separated case_ids to run (blank = every case in the file)'
        required: false
        default: ''
        type: string
      repeats:
        description: 'Independent episodes per case (each on its own fresh agent); 1 = one per case'
        required: false
        default: '1'
        type: string
      lanes:
        description: 'Lane jobs (runner slots held); the cases are dealt round-robin across them'
        required: false
        default: '6'
        type: string
      lane_width:
        description: 'Concurrent episodes per lane, each in its own container on the lane runner'
        required: false
        default: '3'
        type: string
      constraints_url:
        description: 'Optional pip constraints file (raw URL) pinning every package version; blank = the agent requirements ranges'
        required: false
        default: ''
        type: string
      constraints_sha256:
        description: 'sha256 of the constraints file; the run refuses on mismatch (required with constraints_url)'
        required: false
        default: ''
        type: string
      provider_order:
        description: 'OPENROUTER_PROVIDER_ORDER for the agent (preference; OpenRouter falls back if unavailable). Blank = OpenRouter routing'
        required: false
        default: 'DeepInfra,Parasail'
        type: string
      llm_seed:
        description: 'CIRIS_LLM_SEED sent with every call (temperature is 0 by default). Blank = no seed'
        required: false
        default: '20261022'
        type: string
      prestep:
        description: 'Pre-step mode (M4_PRESTEP=1): no correction delivered; default behaviour on every probe twice, and for genuine cases the rule told directly (inline and by the WA). Not scoreable as Market 4 trials'
        required: false
        default: 'false'
        type: string
      amendment_field:
        description: 'Name of the resolve API field that carries the exact amendment text (CIRISAgent#1366 Phase 2; working name amendment_text). Blank = guidance-only resolve, which lands an UNVERIFIED amendment on engines with that change'
        required: false
        default: ''
        type: string
      preferred_language:
        description: 'CIRIS_PREFERRED_LANGUAGE for the agent (e.g. am, es, zh). Blank = the agent default (en). Used to check the context map in a non-English locale'
        required: false
        default: ''
        type: string
      mock_llm:
        description: 'Context-map mode: run with the mock LLM (no key, no spend) and M4_CTXMAP=1, so the harness drives the S1-S6 context fixtures unscored and keeps the reasoning streams for measure.py. Needs a harness with M4_CTXMAP and an engine with the mock controls'
        required: false
        default: 'false'
        type: string
      server_wheel_release:
        description: 'Optional: tag of a (draft) RATCHET release holding a candidate ciris-server wheel, installed over the agent pin with --force-reinstall --no-deps. Blank = the agent pin'
        required: false
        default: ''
        type: string
      server_wheel_sha256:
        description: 'sha256 of that wheel; the run refuses on mismatch (required with server_wheel_release)'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  attestations: write
  contents: read

concurrency:
  group: market4-${{ github.run_id }}
  cancel-in-progress: false

env:
  CIRIS_TRACE_RUN_KIND: qa
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: Plan (verify cases, pin engine)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: write only so this job can read a DRAFT release (the candidate wheel); it runs no agent. The episode
    # jobs keep the workflow's read-only token and receive the wheel as an artifact.
    permissions:
      contents: write
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
      lanes: ${{ steps.cases.outputs.lanes }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISAgent
          ref: ${{ inputs.harness_ref }}
          path: agent
          fetch-depth: 0
      - name: Engine is byte-identical to the pinned commit
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${{ inputs.engine_commit }}^{commit}" || { echo "::error::engine commit not found"; exit 1; }
          if ! git diff --quiet "${{ inputs.engine_commit }}" HEAD -- ciris_engine ciris_adapters main.py requirements.txt; then
            echo "::error::harness checkout differs from engine ${{ inputs.engine_commit }} under the engine paths:"
            git diff --stat "${{ inputs.engine_commit }}" HEAD -- ciris_engine ciris_adapters main.py requirements.txt
            exit 1
          fi
          echo "engine tree identical to ${{ inputs.engine_commit }}; harness commit $(git rev-parse HEAD)"
      - name: Fetch and verify the frozen cases
        id: cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m4-cases
          curl -sSfL "${{ inputs.cases_url }}" -o /tmp/m4-cases/freeze-cases.jsonl
          ACTUAL=$(sha256sum /tmp/m4-cases/freeze-cases.jsonl | cut -d' ' -f1)
          if [ "$ACTUAL" != "${{ inputs.cases_sha256 }}" ]; then
            echo "::error::cases sha256 mismatch: got $ACTUAL, expected ${{ inputs.cases_sha256 }}"; exit 1
          fi
          CASES=$(python3 -I -c '
          import json, sys
          flt = set(sys.argv[1].split())
          reps = max(1, int(sys.argv[2] or "1"))
          ids = [json.loads(l)["case_id"] for l in open("/tmp/m4-cases/freeze-cases.jsonl", encoding="utf-8") if l.strip()]
          ids = [i for i in ids if not flt or i in flt]
          print(json.dumps([{"case": i, "rep": r, "tag": i if reps == 1 else f"{i}-r{r}"} for i in ids for r in range(1, reps + 1)]))
          ' '${{ inputs.case_filter }}' '${{ inputs.repeats }}')
          echo "cases=$CASES" >> "$GITHUB_OUTPUT"
          LANES=$(python3 -I -c '
          import json, sys
          items = json.loads(sys.argv[1]); n = max(1, min(int(sys.argv[2] or "1"), len(items)))
          print(json.dumps([{"lane": k + 1, "items": items[k::n]} for k in range(n)]))
          ' "$CASES" '${{ inputs.lanes }}')
          echo "lanes=$LANES" >> "$GITHUB_OUTPUT"
          echo "lanes: $LANES"
          echo "cases: $CASES"
          python3 -I -c '
          import json
          json.dump({"harness_repo": "https://github.com/CIRISAI/CIRISAgent", "harness_commit": "${{ inputs.harness_ref }}",
                     "engine_commit": "${{ inputs.engine_commit }}", "ratchet_commit": "${{ github.sha }}",
                     "cases_url": "${{ inputs.cases_url }}", "cases_sha256": "${{ inputs.cases_sha256 }}",
                     "model": "${{ inputs.model }}", "template_id": "${{ inputs.template_id }}",
                     "constraints_url": "${{ inputs.constraints_url }}", "constraints_sha256": "${{ inputs.constraints_sha256 }}",
                     "provider_order": "${{ inputs.provider_order }}", "llm_seed": "${{ inputs.llm_seed }}",
                     "workflow_ref": "${{ github.ref }}",
                     "server_wheel_release": "${{ inputs.server_wheel_release }}", "prestep": "${{ inputs.prestep }}", "server_wheel_sha256": "${{ inputs.server_wheel_sha256 }}",
                     "run_id": "${{ github.run_id }}", "cases": json.loads(open("/dev/stdin").read())},
                    open("/tmp/m4-cases/run-manifest.json", "w"), indent=1)
          ' <<< "$CASES"
      - uses: actions/upload-artifact@v4
        with:
          name: m4-frozen-cases
          path: |
            /tmp/m4-cases/freeze-cases.jsonl
            /tmp/m4-cases/run-manifest.json
          retention-days: 90
      - name: Stage the candidate ciris-server wheel
        if: inputs.server_wheel_release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/m4-wheel
          gh release download "${{ inputs.server_wheel_release }}" -R "${{ github.repository }}" -p 'ciris_server-*.whl' -D /tmp/m4-wheel
          WHL=$(ls /tmp/m4-wheel/ciris_server-*.whl | head -1)
          GOT=$(sha256sum "$WHL" | cut -d' ' -f1)
          if [ "$GOT" != "${{ inputs.server_wheel_sha256 }}" ]; then
            echo "::error::server wheel sha256 mismatch: got $GOT, expected ${{ inputs.server_wheel_sha256 }}"; exit 1
          fi
          echo "staged $(basename "$WHL") sha256 $GOT"
      - if: inputs.server_wheel_release != ''
        uses: actions/upload-artifact@v4
        with:
          name: m4-server-wheel
          path: /tmp/m4-wheel/
          retention-days: 30

  # Lanes. Each lane job installs the agent once (a Docker image) and runs its share of the cases `lane_width` at a
  # time, each episode in its own container from that image: its own localhost (the fixed ports 4243/4242/8080/18080
  # do not collide) and its own writable copy of the checkout (data/, logs/, qa_reports/, CIRIS_HOME), so every
  # episode still starts on a freshly booted agent with nothing shared. An episode is mostly waiting on the model, so
  # packing them onto a runner costs little; `lanes` is how many of the org's runner slots the run holds.
  lane:
    name: lane ${{ matrix.lane.lane }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.lanes) }}
    env:
      CIRIS_TEST_MODE: "true"
      CIRIS_TESTING_MODE: "true"
      M4_ENGINE_COMMIT: ${{ inputs.engine_commit }}
      M4_HARNESS_COMMIT: ${{ inputs.harness_ref }}
      MODEL_INPUT: ${{ inputs.model }}
      TEMPLATE_INPUT: ${{ inputs.template_id }}
      OPENROUTER_PROVIDER_ORDER: ${{ inputs.provider_order }}
      CIRIS_LLM_SEED: ${{ inputs.llm_seed }}
      M4_PRESTEP: ${{ inputs.prestep == 'true' && '1' || '' }}
      M4_CTXMAP: ${{ inputs.mock_llm == 'true' && '1' || '' }}
      M4_MOCK: ${{ inputs.mock_llm == 'true' && '1' || '' }}
      M4_AMENDMENT_FIELD: ${{ inputs.amendment_field }}
      CIRIS_PREFERRED_LANGUAGE: ${{ inputs.preferred_language }}
      M4_PROBE_LANGUAGE: ${{ inputs.preferred_language }}
      M4_MAX_ATTEMPTS: '4'
      M4_PAUSE_BUDGET_S: '5400'
      M4_ATTEMPT_TIMEOUT_S: '7800'
      M4_MIN_KEY_REMAINING: '2'
      LANE_WIDTH: ${{ inputs.lane_width }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ratchet
      - uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISAgent
          ref: ${{ inputs.harness_ref }}
          path: build/agent
      - if: inputs.server_wheel_release != ''
        uses: actions/download-artifact@v4
        with:
          name: m4-server-wheel
          path: build/extra
      - name: Fetch the constraints file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/extra
          if [ -n "${{ inputs.constraints_url }}" ]; then
            curl -sSfL "${{ inputs.constraints_url }}" -o build/extra/constraints.txt
            GOT=$(sha256sum build/extra/constraints.txt | cut -d' ' -f1)
            if [ "$GOT" != "${{ inputs.constraints_sha256 }}" ]; then
              echo "::error::constraints sha256 mismatch: got $GOT, expected ${{ inputs.constraints_sha256 }}"; exit 1
            fi
          fi
          if [ -n "${{ inputs.server_wheel_release }}" ]; then
            WHL=$(ls build/extra/ciris_server-*.whl | head -1)
            GOT=$(sha256sum "$WHL" | cut -d' ' -f1)
            if [ "$GOT" != "${{ inputs.server_wheel_sha256 }}" ]; then
              echo "::error::server wheel sha256 mismatch: got $GOT, expected ${{ inputs.server_wheel_sha256 }}"; exit 1
            fi
          fi
      - name: Build the agent image (one install for the whole lane)
        shell: bash
        run: docker build -q -t m4-agent -f ratchet/.github/m4/Dockerfile build
      - uses: actions/download-artifact@v4
        with:
          name: m4-frozen-cases
          path: /tmp/m4-cases
      - name: Write OpenRouter key
        if: ${{ inputs.mock_llm != 'true' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.RATCHET_OPENROUTER_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENROUTER_API_KEY" ]; then echo "::error::RATCHET_OPENROUTER_KEY not in scope"; exit 1; fi
          umask 077
          printf '%s' "$OPENROUTER_API_KEY" > "$RUNNER_TEMP/openrouter_key"
      - name: Run this lane's episodes, lane_width at a time, one container each
        timeout-minutes: 330
        shell: bash
        env:
          ITEMS: ${{ toJSON(matrix.lane.items) }}
        run: |
          set -u -o pipefail
          mkdir -p out/_lane
          ENV_NAMES="CIRIS_TRACE_RUN_KIND PYTHONUNBUFFERED CIRIS_TEST_MODE CIRIS_TESTING_MODE M4_ENGINE_COMMIT M4_HARNESS_COMMIT
            MODEL_INPUT TEMPLATE_INPUT OPENROUTER_PROVIDER_ORDER CIRIS_LLM_SEED M4_PRESTEP M4_CTXMAP M4_MOCK
            M4_AMENDMENT_FIELD CIRIS_PREFERRED_LANGUAGE M4_PROBE_LANGUAGE M4_MAX_ATTEMPTS M4_PAUSE_BUDGET_S
            M4_ATTEMPT_TIMEOUT_S M4_MIN_KEY_REMAINING M4_INFLIGHT_STOP"
          DARGS=(--rm --shm-size=1g -v /tmp/m4-cases:/tmp/m4-cases:ro -v "$PWD/out:/out"
                 -v "$PWD/ratchet/.github/m4/episode.sh:/m4/episode.sh:ro")
          for n in $ENV_NAMES; do DARGS+=(-e "$n"); done
          [ -f "$RUNNER_TEMP/openrouter_key" ] && DARGS+=(-v "$RUNNER_TEMP/openrouter_key:/root/.openrouter_key:ro")
          ( while :; do   # lane resources, to size lane_width from evidence
              printf '%s\t%s\t%s\n' "$(date -u +%FT%TZ)" "$(free -m | awk '/Mem:/{print $3"/"$2" MB"}')" \
                "$(docker stats --no-stream --format '{{.Name}}={{.MemUsage}},{{.CPUPerc}}' | tr '\n' ' ')" >> out/_lane/resources.tsv
              sleep 20; done ) & SAMPLER=$!
          run_one() {
            echo "start $2 ($(date -u +%T))"
            docker run --name "m4-$2" "${DARGS[@]}" m4-agent bash /m4/episode.sh "$1" "$2" > "out/_lane/$2.console.log" 2>&1
            echo "end $2 rc=$? ($(date -u +%T))"
          }
          export -f run_one
          # xargs cannot pass bash arrays; re-declare them inside each worker from a serialised copy
          declare -p DARGS > "$RUNNER_TEMP/dargs.sh"
          jq -r '.[] | "\(.case) \(.tag)"' <<< "$ITEMS" \
            | xargs -P "$LANE_WIDTH" -L 1 bash -c 'source "$RUNNER_TEMP/dargs.sh"; run_one "$0" "$1"'
          kill "$SAMPLER" 2>/dev/null || true
          FAIL=0
          for t in $(jq -r '.[].tag' <<< "$ITEMS"); do
            RC=$(cat "out/_lane/$t.rc" 2>/dev/null || echo missing)
            echo "::group::$t (rc=$RC)"; cat "out/_lane/$t.console.log" 2>/dev/null; echo "::endgroup::"
            grep -hE '^::(notice|error|warning)::' "out/_lane/$t.console.log" 2>/dev/null || true
            cat "out/_lane/$t.summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            if [ "$RC" != 0 ] || [ ! -s "out/m4-raw-$t/"*.jsonl ]; then echo "::error::$t: rc=$RC or no raw log"; FAIL=1; fi
          done
          { echo "### lane ${{ matrix.lane.lane }} resources (peak used memory)"; sort -t$'\t' -k2 -V out/_lane/resources.tsv | tail -1; } >> "$GITHUB_STEP_SUMMARY" || true
          exit $FAIL
      - name: Attest the raw logs and the installed environment
        if: always()
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/m4-raw-*/*.jsonl
            out/m4-agent-logs-*/qa_reports/correction_episodes/*_env_logs/pip-freeze.txt
      - name: Upload the lane's raw logs and agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-lane-${{ matrix.lane.lane }}
          path: out/
          retention-days: 30
          if-no-files-found: error
