name: Market 4 correction eval

# ai-safety-claims Market 4 ("corrections change the system", contract v3) on a
# real CIRIS agent with a live model: one frozen correction episode per job,
# each on a freshly booted agent.
#
# The harness (tools/qa_runner correction_episodes + its registration) lives in
# CIRISAgent on the branch market4/correction-eval, pinned here by commit. The
# SYSTEM UNDER TEST is the engine at `engine_commit`; the `plan` job fails the
# run if the harness checkout's ciris_engine/, ciris_adapters/, main.py or
# requirements.txt differ from it. This file lives in RATCHET because
# workflow_dispatch needs the workflow on a default branch and RATCHET already
# holds the OpenRouter key its other live-model experiments use.
#
# The frozen cases come in by URL + sha256 (the workbench freeze tag), so the
# run can only use the cases that were frozen. Every raw log is attested.

on:
  workflow_dispatch:
    inputs:
      cases_url:
        description: 'URL of the frozen freeze-cases.jsonl (raw file at the workbench freeze tag)'
        required: true
        type: string
      cases_sha256:
        description: 'sha256 of that file; the run refuses on mismatch'
        required: true
        type: string
      harness_ref:
        description: 'CIRISAgent commit carrying the harness (branch market4/correction-eval)'
        required: false
        default: '98e5433088a2a78f767ae0fc45f7df0f203461ef'
        type: string
      engine_commit:
        description: 'Engine commit the harness checkout must be byte-identical to under ciris_engine/, ciris_adapters/, main.py, requirements.txt'
        required: false
        default: '7e0cb939c6641117aa6cf4468166e2ff16f66cef'
        type: string
      model:
        description: 'OpenRouter model id for the agent under test'
        required: false
        default: 'qwen/qwen3.6-35b-a3b'
        type: string
      template_id:
        description: 'Agent template'
        required: false
        default: 'default'
        type: string
      case_filter:
        description: 'Space-separated case_ids to run (blank = every case in the file)'
        required: false
        default: ''
        type: string
      max_parallel:
        description: 'Concurrent episodes'
        required: false
        default: '6'
        type: string

permissions:
  id-token: write
  attestations: write
  contents: read

concurrency:
  group: market4-${{ inputs.cases_sha256 }}-${{ inputs.case_filter }}
  cancel-in-progress: false

env:
  CIRIS_TRACE_RUN_KIND: qa
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: Plan (verify cases, pin engine)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISAgent
          ref: ${{ inputs.harness_ref }}
          path: agent
          fetch-depth: 0
      - name: Engine is byte-identical to the pinned commit
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${{ inputs.engine_commit }}^{commit}" || { echo "::error::engine commit not found"; exit 1; }
          if ! git diff --quiet "${{ inputs.engine_commit }}" HEAD -- ciris_engine ciris_adapters main.py requirements.txt; then
            echo "::error::harness checkout differs from engine ${{ inputs.engine_commit }} under the engine paths:"
            git diff --stat "${{ inputs.engine_commit }}" HEAD -- ciris_engine ciris_adapters main.py requirements.txt
            exit 1
          fi
          echo "engine tree identical to ${{ inputs.engine_commit }}; harness commit $(git rev-parse HEAD)"
      - name: Fetch and verify the frozen cases
        id: cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m4-cases
          curl -sSfL "${{ inputs.cases_url }}" -o /tmp/m4-cases/freeze-cases.jsonl
          ACTUAL=$(sha256sum /tmp/m4-cases/freeze-cases.jsonl | cut -d' ' -f1)
          if [ "$ACTUAL" != "${{ inputs.cases_sha256 }}" ]; then
            echo "::error::cases sha256 mismatch: got $ACTUAL, expected ${{ inputs.cases_sha256 }}"; exit 1
          fi
          CASES=$(python3 -I -c '
          import json, sys
          flt = set(sys.argv[1].split())
          ids = [json.loads(l)["case_id"] for l in open("/tmp/m4-cases/freeze-cases.jsonl", encoding="utf-8") if l.strip()]
          print(json.dumps([i for i in ids if not flt or i in flt]))
          ' '${{ inputs.case_filter }}')
          echo "cases=$CASES" >> "$GITHUB_OUTPUT"
          echo "cases: $CASES"
          python3 -I -c '
          import json
          json.dump({"harness_repo": "https://github.com/CIRISAI/CIRISAgent", "harness_commit": "${{ inputs.harness_ref }}",
                     "engine_commit": "${{ inputs.engine_commit }}", "ratchet_commit": "${{ github.sha }}",
                     "cases_url": "${{ inputs.cases_url }}", "cases_sha256": "${{ inputs.cases_sha256 }}",
                     "model": "${{ inputs.model }}", "template_id": "${{ inputs.template_id }}",
                     "run_id": "${{ github.run_id }}", "cases": json.loads(open("/dev/stdin").read())},
                    open("/tmp/m4-cases/run-manifest.json", "w"), indent=1)
          ' <<< "$CASES"
      - uses: actions/upload-artifact@v4
        with:
          name: m4-frozen-cases
          path: |
            /tmp/m4-cases/freeze-cases.jsonl
            /tmp/m4-cases/run-manifest.json
          retention-days: 90

  episode:
    name: ${{ matrix.case }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        case: ${{ fromJSON(needs.plan.outputs.cases) }}
    env:
      CIRIS_TEST_MODE: "true"
      CIRIS_TESTING_MODE: "true"
      M4_ENGINE_COMMIT: ${{ inputs.engine_commit }}
      M4_HARNESS_COMMIT: ${{ inputs.harness_ref }}
      MODEL_INPUT: ${{ inputs.model }}
      TEMPLATE_INPUT: ${{ inputs.template_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISAgent
          ref: ${{ inputs.harness_ref }}
          path: agent
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-m4-${{ runner.os }}-${{ hashFiles('agent/requirements.txt', 'agent/requirements-dev.txt') }}
      - name: Install CIRISVerify system deps (libtss2)
        shell: bash
        run: |
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && \
            sudo apt-get install -y --no-install-recommends libtss2-tctildr0 libtss2-esys-3.0.2-0 libtss2-mu-4.0.1-0 && break
            sleep 15
          done
      - name: Install the agent and the QA runner
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: m4-frozen-cases
          path: /tmp/m4-cases
      - name: Write OpenRouter key
        env:
          OPENROUTER_API_KEY: ${{ secrets.RATCHET_OPENROUTER_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENROUTER_API_KEY" ]; then echo "::error::RATCHET_OPENROUTER_KEY not in scope"; exit 1; fi
          umask 077
          printf '%s' "$OPENROUTER_API_KEY" > "$HOME/.openrouter_key"
      - name: Run the episode
        id: run
        timeout-minutes: 135
        working-directory: agent
        shell: bash
        run: |
          set -o pipefail
          mkdir -p qa_reports
          python3 -m tools.qa_runner correction_episodes \
            --correction-cases-file /tmp/m4-cases/freeze-cases.jsonl \
            --correction-case-id "${{ matrix.case }}" \
            --live --live-key-file "$HOME/.openrouter_key" \
            --live-base-url https://openrouter.ai/api/v1 \
            --live-model "$MODEL_INPUT" \
            --safety-battery-template "$TEMPLATE_INPUT" \
            --wipe-data --proceed-anyway --timeout 7200 --verbose 2>&1 | tee "qa_reports/episode_${{ matrix.case }}.log"
      - name: Raw log present
        if: always()
        working-directory: agent
        shell: bash
        run: |
          ls -la qa_reports/correction_episodes/ || true
          test -s "qa_reports/correction_episodes/${{ matrix.case }}.jsonl"
      - name: Attest the raw log
        if: always()
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: agent/qa_reports/correction_episodes/${{ matrix.case }}.jsonl
      - name: Upload the raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-raw-${{ matrix.case }}
          path: agent/qa_reports/correction_episodes/${{ matrix.case }}.jsonl
          retention-days: 90
          if-no-files-found: error
      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-agent-logs-${{ matrix.case }}
          path: |
            agent/qa_reports/episode_${{ matrix.case }}.log
            agent/qa_reports/correction_episodes/${{ matrix.case }}_*_logs/
            agent/logs/
          retention-days: 30
          if-no-files-found: warn
